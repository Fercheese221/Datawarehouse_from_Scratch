# SQL Server 2022 para el proyecto Data Warehouse.
# Las carpetas datasets y scripts del repo se montan dentro del contenedor.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: sql-dwh-project
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SqlServer!2026"
    ports:
      - "1433:1433"
    volumes:
      - sql-dwh-project-data:/var/opt/mssql
      - ./datasets:/datasets:ro
      - ./scripts:/scripts:ro
      - ./tests:/tests:ro
volumes:
  sql-dwh-project-data: